<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burndown · sign in</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08090d">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0d12'/><path d='M6 8 L14 14 L19 12 L26 24' stroke='%238b6cff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --glow:rgba(109,74,255,.14); --panel:#ffffff; --panel-2:#f8f9fc; --line:#e2e5ee; --line-2:#d3d8e4;
  --text:#141722; --muted:#5d6477; --faint:#9aa1b3; --accent:#6d4aff; --accent-2:#0aa6c9; --accent-soft:rgba(109,74,255,.12);
  --danger:#e0414a; --danger-soft:rgba(224,65,74,.10); --shadow:0 30px 80px rgba(15,20,35,.14);
  --font:"Inter",system-ui,sans-serif; --display:"Space Grotesk","Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08090d; --glow:rgba(139,108,255,.22); --panel:#10131b; --panel-2:#141823; --line:#1f2533; --line-2:#2a3244;
    --text:#e7eaf2; --muted:#98a0b5; --faint:#5c6479; --accent:#8b6cff; --accent-2:#22d3ee; --accent-soft:rgba(139,108,255,.16);
    --danger:#ff5a64; --danger-soft:rgba(255,90,100,.12); --shadow:0 40px 100px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#08090d; --glow:rgba(139,108,255,.22); --panel:#10131b; --panel-2:#141823; --line:#1f2533; --line-2:#2a3244;
  --text:#e7eaf2; --muted:#98a0b5; --faint:#5c6479; --accent:#8b6cff; --accent-2:#22d3ee; --accent-soft:rgba(139,108,255,.16);
  --danger:#ff5a64; --danger-soft:rgba(255,90,100,.12); --shadow:0 40px 100px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(900px 500px at 20% 0%,var(--glow),transparent 60%),
                   radial-gradient(700px 400px at 90% 100%,rgba(34,211,238,.08),transparent 60%);
  color:var(--text);font:15px/1.5 var(--font);display:grid;place-items:center;padding:16px;-webkit-font-smoothing:antialiased;
}
.wrap{width:min(400px,100%)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 30px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.brand{display:flex;align-items:center;gap:10px;font:700 24px/1 var(--display);letter-spacing:-.03em;margin-bottom:26px}
.brand b{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chart{display:block;width:100%;height:64px;margin:0 0 22px}
.chart .ideal{stroke:var(--line-2);stroke-dasharray:4 5}
.chart .actual{stroke:url(#lg);stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.6s .2s cubic-bezier(.3,.7,.2,1) forwards}
.chart .dot{fill:var(--accent-2);opacity:0;animation:pop .3s 1.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
h1{font:700 22px/1.25 var(--display);letter-spacing:-.02em;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.field{position:relative}
input{width:100%;font:inherit;color:inherit;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 46px 12px 14px;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field.err input{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--faint);width:36px;height:36px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--text);background:var(--line)}
.msg{min-height:20px;font-size:13px;color:var(--danger);margin:8px 0 6px}
button.go{width:100%;border:0;border-radius:12px;padding:12px 16px;font:600 15px var(--font);color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,var(--accent-2)));
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent);display:flex;align-items:center;justify-content:center;gap:10px;transition:filter .15s,transform .05s}
button.go:hover{filter:brightness(1.08)}
button.go:active{transform:translateY(1px)}
button.go:disabled{opacity:.7;cursor:progress}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}
.busy .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--faint);font-size:12.5px;margin-top:18px}
.foot code{font:500 12px var(--mono)}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--panel-2)" stroke="var(--line)"/><path d="M6 8 L13 14 L18 12 L26 24" stroke="url(#g)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs></svg>
      <span><b>burn</b>down</span>
    </div>
    <svg class="chart" viewBox="0 0 320 64" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
      <line class="ideal" x1="4" y1="6" x2="316" y2="58" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <path class="actual" d="M4 6 L40 10 L72 10 L100 22 L132 24 L160 30 L196 33 L226 42 L258 46 L290 54 L316 58" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <circle class="dot" cx="316" cy="58" r="4"/>
    </svg>
    <h1>Welcome back.</h1>
    <p class="sub">Your commitments are waiting. Let's see what's left.</p>
    <form id="f" novalidate>
      <label for="pw">Password</label>
      <div class="field" id="fld">
        <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
        <button class="eye" type="button" id="eye" aria-label="Show password" title="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button class="go" id="go" type="submit"><span class="spin"></span><span id="goTxt">Open the board</span></button>
    </form>
  </div>
  <div class="foot">Stays signed in on this device for 30 days</div>
</main>
<script>
"use strict";
try { const t = JSON.parse(localStorage.getItem("bd:theme") || '"system"'); if (t !== "system") document.documentElement.dataset.theme = t; } catch {}
const f = document.getElementById("f"), pw = document.getElementById("pw"), msg = document.getElementById("msg"),
      fld = document.getElementById("fld"), go = document.getElementById("go");
document.getElementById("eye").onclick = () => { pw.type = pw.type === "password" ? "text" : "password"; pw.focus(); };
pw.addEventListener("input", () => { fld.classList.remove("err"); msg.textContent = ""; });
f.addEventListener("submit", async e => {
  e.preventDefault();
  if (!pw.value){ fld.classList.add("err"); msg.textContent = "Enter your password."; return; }
  go.disabled = true; go.classList.add("busy"); document.getElementById("goTxt").textContent = "Checking…";
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password: pw.value})});
    const j = await r.json().catch(() => ({}));
    if (r.ok){ document.getElementById("goTxt").textContent = "Let's go"; location.replace("/"); return; }
    msg.textContent = j.error || "Couldn't sign in.";
  } catch { msg.textContent = "Can't reach the server."; }
  fld.classList.remove("err"); void fld.offsetWidth; fld.classList.add("err");
  pw.select();
  go.disabled = false; go.classList.remove("busy"); document.getElementById("goTxt").textContent = "Open the board";
});
</script>
</body>
</html>
